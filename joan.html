<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyFingers - Clon Personalizado con Estrellas</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0b1a; /* Fondo un poco más oscuro para el espacio */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* Capa para las estrellas de fondo */
        #stars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            opacity: 0.8;
            pointer-events: none;
        }
        /* Pantalla de juego */
        #game-screen {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 2;
        }
        /* Contador de caos */
        #counter {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 20px;
            color: white;
            font-size: 1.2rem;
            pointer-events: none;
            z-index: 10;
        }
        /* Instrucción inicial */
        #instruction {
            color: rgba(255, 255, 255, 0.6);
            font-size: 2rem;
            text-align: center;
            pointer-events: none;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 0.8; }
            100% { opacity: 0.3; }
        }
        /* Estilo de las letras y emojis flotantes */
        .floating-element {
            position: absolute;
            transform: translate(-50%, -50%) scale(0);
            font-size: 12rem;
            font-weight: bold;
            pointer-events: none;
            animation: popInOut 2.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popInOut {
            0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 0; }
            15% { transform: translate(-50%, -50%) scale(1) rotate(var(--rand-rot)); opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translate(-50%, -150%) scale(0.5) rotate(var(--rand-rot)); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="stars-container"></div>

    <div id="game-screen">
        <div id="counter">Teclas presionadas: <span id="score">0</span></div>
        <div id="instruction">¡Presiona cualquier tecla o toca la pantalla!</div>
    </div>
<script>
 const gameScreen = document.getElementById('game-screen');
 const starsContainer = document.getElementById('stars-container');
 const scoreDisplay = document.getElementById('score');
 const instruction = document.getElementById('instruction');

 let keysSmashed = 0;
 const keyStates = {};
 const colors = ['#FF4136', '#FF851B', '#FFDC00', '#2ECC40', '#0074D9', '#B10DC9', '#FF41B4', '#01FF70', '#7FDBFF'];
 
 const emojis = ['😀', '🦊', '🐱', '🌙','🦁', '🐸', '🚂','🦖', '🚗', '🚀', '🎨', '🧩', '🚜', '🍕', '🍓', '🌈', '🌸', '⭐', '🐶', '🌙', '🚂', '🚌', '🍓', '🌈', '🌸', '🚜'];

 // 1. Cambia estos nombres por las rutas reales de tus 5 fotos
 const misFotos = [
   'foto1.jpg',
   'foto2.jpg',
   'foto3.png',
   'foto4.jpg',
   'foto5.jpg'
 ];

 function generateStars() {
   const numberOfStars = 160;
   for (let i = 0; i < numberOfStars; i++) {
     const star = document.createElement('div');
     star.className = 'star';
     const size = Math.random() * 2.5 + 1;
     star.style.width = `${size}px`;
     star.style.height = `${size}px`;
     star.style.left = `${Math.random() * 100}%`;
     star.style.top = `${Math.random() * 100}%`;
     star.style.opacity = Math.random() * 0.6 + 0.4;
     starsContainer.appendChild(star);
   }
 }
 generateStars();

 function spawnElement(content, x, y) {
   if (instruction) instruction.style.display = 'none';
   keysSmashed++;
   scoreDisplay.textContent = keysSmashed;

   const element = document.createElement('div');
   element.className = 'floating-element';
   element.style.left = `${x}px`;
   element.style.top = `${y}px`;

   // 2. REVISAR SI EL CONTENIDO ES UNA FOTO
   // Si el contenido termina en una extensión de imagen conocida, creamos una etiqueta <img>
   if (content.match(/\.(jpeg|jpg|gif|png)$/i)) {
     const img = document.createElement('img');
     img.src = content;
     img.style.width = '280px'; // Puedes cambiar el tamaño de la foto aquí
     img.style.height = '280px';
     img.style.objectFit = 'cover';
     img.style.borderRadius = '24px'; // Bordes redondos estéticos
     element.appendChild(img);
   } else {
     // Si no es foto, se comporta normalmente con texto o emoji
     element.textContent = content;
     if (content.length === 1 && !emojis.includes(content)) {
       element.style.color = colors[Math.floor(Math.random() * colors.length)];
     }
   }

   const randomRotation = (Math.random() * 40 - 20) + 'deg';
   element.style.setProperty('--rand-rot', randomRotation);
   gameScreen.appendChild(element);

   setTimeout(() => {
     element.remove();
   }, 5000);
 }

 // 3. FUNCIÓN PARA ELEGIR  ENTRE UN EMOJI O UNA FOTO PROPIA
 function obtenerSorpresaAleatoria() {
   // Hay un 33% de probabilidad de que salga una foto (0.33)
   // Si quieres que salgan más seguido, sube el número (ej: 0.40 para 40%)
   if (Math.random() < 0.33) {
     return misFotos[Math.floor(Math.random() * misFotos.length)];
   } else {
     return emojis[Math.floor(Math.random() * emojis.length)];
   }
 }

 function triggerKeyAction(key) {
   let contentToShow = key;
   if (key === 'SPACE' || key.length > 1 || Math.random() > 0.7) {
     contentToShow = obtenerSorpresaAleatoria();
   }
   const randomX = Math.random() * (window.innerWidth - 200) + 100;
   const randomY = Math.random() * (window.innerHeight - 200) + 100;
   spawnElement(contentToShow, randomX, randomY);
 }

 window.addEventListener('keydown', (event) => {
   if (event.key === ' ' || event.key === 'Spacebar') {
     event.preventDefault();
   }
   let key = event.key;
   if (key === ' ' || key === 'Spacebar') {
     key = 'SPACE';
   } else {
     key = key.toUpperCase();
   }
   if (event.ctrlKey || event.altKey || event.metaKey || key === 'ESCAPE' || key === 'TAB') {
     return;
   }
   if (keyStates[key]) {
     return;
   }
   keyStates[key] = { intervalId: null };
   triggerKeyAction(key);
   keyStates[key].intervalId = setInterval(() => {
     triggerKeyAction(key);
   }, 2000);
 });

 window.addEventListener('keyup', (event) => {
   let key = event.key;
   if (key === ' ' || key === 'Spacebar') {
     key = 'SPACE';
   } else {
     key = key.toUpperCase();
   }
   if (keyStates[key]) {
     clearInterval(keyStates[key].intervalId);
     delete keyStates[key];
   }
 });

 window.addEventListener('blur', () => {
   for (const key in keyStates) {
     clearInterval(keyStates[key].intervalId);
     delete keyStates[key];
   }
 });

 gameScreen.addEventListener('click', (event) => {
   const randomContent = obtenerSorpresaAleatoria();
   spawnElement(randomContent, event.clientX, event.clientY);
 });
</script>

</body>
</html>
